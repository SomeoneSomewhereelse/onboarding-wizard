[project]
name = "onboarding-wizard"
version = "0.1.0"
description = "Self-service setup wizard: provisions a visitor's own bot+dashboard deployment"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pygithub>=2.4",
    "google-genai>=0.3",
    "httpx>=0.27",
    "groq>=1.5.0",
    "google-auth>=2.35",
    # Imported directly by github_client.py (JWT-signing) and requests-based
    # transport for the sync google-auth credential refresh path.
    "pyjwt>=2.13",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "cryptography>=43",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    # Imported directly by tests/test_onboarding_github_client.py to build a
    # real RSA key; transitive via pygithub[crypto] otherwise.
    "cryptography>=44.0",
    "playwright>=1.62.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "respx>=0.21",
    "ruff>=0.7",
    "testcontainers[postgres]>=4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "tests" (in addition to the repo root) is needed so that
# `from conftest import ...` (used by tests/test_conftest_guards.py and
# tests/test_conftest_db_marker_hook.py to unit-test tests/conftest.py's own
# helpers) resolves to tests/conftest.py -- conftest.py lives inside tests/
# now, not at the repo root.
pythonpath = [".", "tests"]
# -n is a PINNED 4, deliberately not `auto` -- see the 2026-08-19
# test-suite-performance design doc (carried over from the monorepo) for the
# measured reasoning: a fixed worker-startup cost per xdist worker dominates
# this suite's runtime, and `auto` (spinning one worker per core) was
# measured slower than a small fixed count on a many-core machine.
addopts = "-n 4 --dist=loadgroup --import-mode=importlib"
markers = [
    "db: transitively touches the shared Postgres via the db fixture (auto-applied by tests/conftest.py's pytest_collection_modifyitems hook, not meant to be added by hand)",
    "xdist_meta: exercises real xdist worker subprocess scheduling via pytester -- slow, excluded from the fast-iteration `-m` filter",
    "browser: drives a real headless Chromium instance via Playwright against the live app (auto-applied by tests/conftest.py's pytest_collection_modifyitems hook, not meant to be added by hand) -- slower than the rest of the suite, excluded from the fast-iteration `-m` filter",
]
