name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
      PR_REVIEW_BOT_PATH: ${{ github.workspace }}/pr-review-bot
    steps:
      - uses: actions/checkout@v7

      # Pinned (not `main`) so this repo's CI never goes red for an
      # unrelated pr-review-bot change -- bump .ci/pr-review-bot-ref
      # deliberately (uv run python -m scripts.update_bot_contract, never by
      # hand) when the two need to move together. This pin now powers two
      # things: tests/test_cross_repo_config_ordering.py's live-Postgres
      # wizard-seed-then-bot-boot chronology test (ISSUES.md 2026-09-09 is
      # the bug it exists to catch), and tests/test_bot_contract_parity.py's
      # check that the vendored contracts/provisioning.json still matches
      # the bot at this exact commit. Both FAIL rather than skip when this
      # checkout is missing, so a broken step here shows up as a failure,
      # not a quietly-skipped pass.
      - name: Read pinned pr-review-bot ref
        id: pr_review_bot_ref
        # The pin's format is fixed by pr-review-bot's docs/superpowers/specs/
        # 2026-09-10-cross-repo-contract-direction-design.md section 5.5:
        # exactly one 40-hex line, plus optional '#' comment lines so a
        # deliberately-held pin can record why. A plain `cat` would hand a
        # comment line to actions/checkout as a ref -- grep the sha line
        # itself, and fail loudly if there isn't exactly one.
        run: |
          sha="$(grep -m1 -E '^[0-9a-f]{40}$' .ci/pr-review-bot-ref)"
          test -n "$sha" || { echo "no 40-hex sha line in .ci/pr-review-bot-ref"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pr-review-bot
        uses: actions/checkout@v7
        with:
          repository: TovTechOrg/pr-review-bot
          ref: ${{ steps.pr_review_bot_ref.outputs.sha }}
          path: pr-review-bot

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install pr-review-bot's dependencies
        working-directory: pr-review-bot
        run: uv sync --all-extras --dev

      - name: Install Playwright's Chromium browser
        run: uv run playwright install --with-deps chromium

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -v
